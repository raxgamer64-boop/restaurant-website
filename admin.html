<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">

  <title>Dutta Restaurant — Admin</title>

  <link rel="stylesheet" href="admin.css?v=4">
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <div id="login">

    <div class="login">

      <div class="mark">D</div>

      <h1>Dutta Restaurant</h1>

      <p>Owner Admin</p>

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Admin PIN"
        maxlength="20"
      >

      <button id="loginBtn" type="button">
        Open Dashboard
      </button>

      <small>
        Demo PIN: 2026
        <br>
        Change it in admin.js before delivery.
      </small>

      <div id="loginMessage"></div>

    </div>

  </div>


  <!-- =========================
       ADMIN APP
  ========================== -->

  <div id="app" hidden>

    <!-- SIDEBAR -->

    <aside>

      <div class="sideBrand">
        <b>DUTTA</b>
        <small>RESTAURANT ADMIN</small>
      </div>

      <button class="side on" type="button" data-page="overview">
        Overview
      </button>

      <button class="side" type="button" data-page="brand">
        Restaurant Info
      </button>

      <button class="side" type="button" data-page="hero">
        Homepage
      </button>

      <button class="side" type="button" data-page="menu">
        Menu & Prices
      </button>

      <button class="side" type="button" data-page="gallery">
        Gallery
      </button>

      <button class="side" type="button" data-page="settings">
        Backup & Reset
      </button>

      <a href="index.html" target="_blank" rel="noopener">
        View Website ↗
      </a>

      <button
        id="logoutBtn"
        type="button"
        class="side logoutBtn"
      >
        Logout
      </button>

    </aside>


    <!-- MAIN -->

    <main>

      <div class="mobileTop">
        <b>Dutta Admin</b>

        <a href="index.html" target="_blank" rel="noopener">
          View site
        </a>
      </div>

      <section id="page"></section>

    </main>

  </div>


  <!-- DATA MUST LOAD BEFORE ADMIN JS -->

  <script src="data.js?v=4"></script>
  <script src="admin.js?v=5"></script>

</body>
</html>
