<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Datta Restaurant</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"><link rel="stylesheet" href="admin.css"><style>.admin-login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.admin-login-card{width:min(460px,100%);background:#111615;border:1px solid var(--line);border-radius:22px;padding:30px}.admin-login-card h1{font:700 42px 'Playfair Display';margin:8px 0}.admin-login-card h1 em{color:var(--gold);font-style:italic}.admin-login-card p{color:#8e9791}.admin-login-card form{display:grid;gap:14px;margin-top:22px}.admin-login-card label{display:grid;gap:6px;font-size:12px;color:#aaa}.admin-login-card input{background:#0b100f;border:1px solid #39403b;color:#fff;border-radius:10px;padding:13px;font:inherit}.admin-login-card button{border:0;background:var(--gold);color:#111;padding:13px;border-radius:10px;font-weight:800;cursor:pointer}.login-error{min-height:20px;color:#ffaaa0;font-size:12px}</style></head><body><main class="admin-login-shell"><section class="admin-login-card"><a href="index.html" style="color:#aaa;text-decoration:none">← Back to website</a><p style="margin-top:28px;letter-spacing:.18em;font-weight:800;font-size:11px;color:#d3a83e">STAFF ACCESS</p><h1>Admin <em>Login.</em></h1><p>Secure access to restaurant management.</p><form id="adminLoginForm"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Open Admin Panel →</button></form><div id="loginError" class="login-error"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="config.js"></script><script>document.getElementById('adminLoginForm').onsubmit=async e=>{e.preventDefault();const out=document.getElementById('loginError');out.textContent='Signing in…';try{const r=await login(e.target.email.value,e.target.password.value);if(r.role!=='admin')throw new Error('This account does not have admin access.');location.href='admin.html';}catch(err){out.textContent=err.message||'Unable to sign in.'}};</script></body></html>
